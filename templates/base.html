<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}ViaJuc{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Lexend:wght@800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="{% block fundo %}fundo-onibus{% endblock %}" data-page="{% block pagina %}{% endblock %}">
    <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-bus" viewBox="0 0 24 24">
        <rect x="4" y="3" width="16" height="15" rx="2"/>
        <path d="M4 11h16M8 6v5M16 6v5M6 18v3M18 18v3"/>
        <circle cx="8" cy="15" r=".6"/>
        <circle cx="16" cy="15" r=".6"/>
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.3-4.3"/>
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <path d="M9 22V12h6v10"/>
      </symbol>
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a2 2 0 0 0 3.4 0"/>
      </symbol>
      <symbol id="i-phone" viewBox="0 0 24 24">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21a8 8 0 0 1 16 0"/>
      </symbol>
      <symbol id="i-swap" viewBox="0 0 24 24">
        <path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M12 20h9"/>
        <path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="12" height="12" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 6v6l4 2"/>
      </symbol>
    </svg>

    <header class="topo">
      <a class="marca" href="/" aria-label="ViaJuc - início">
        <svg class="ico"><use href="#i-bus"/></svg>
        <b>VIAJUC</b>
        <small>Descubra como e quando chegar</small>
      </a>

      <nav aria-label="Navegação principal">
        <a href="/" title="Buscar viagem" aria-label="Buscar viagem">
          <svg class="ico"><use href="#i-search"/></svg>
        </a>
        <a href="/" title="Início" aria-label="Início">
          <svg class="ico"><use href="#i-home"/></svg>
        </a>
        <button type="button" title="Notificações (em breve)" aria-label="Notificações">
          <svg class="ico"><use href="#i-bell"/></svg>
        </button>
        <button type="button" title="Contato (em breve)" aria-label="Contato">
          <svg class="ico"><use href="#i-phone"/></svg>
        </button>
        <a href="/motorista/painel" title="Área do motorista" aria-label="Área do motorista">
          <svg class="ico"><use href="#i-user"/></svg>
        </a>
      </nav>
    </header>

    <main>
      {% block conteudo %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
